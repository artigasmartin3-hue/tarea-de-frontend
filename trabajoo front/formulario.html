<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="container">
        <h2>Formulario de Registro</h2>
        <p>Complete todos los campos del formulario</p>
        <hr>
        <form action="siguiente.html" method="get" onsubmit="return validar()">

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="username" class="form-label">Nombre de usuario</label>
                    <input type="text" class="form-control" id="username">
                    <div id="username-msg" class="form-text text-danger"></div>
                </div>
                <div class="col-md-3 mb-3">
                    <label for="password" class="form-label">Clave</label>
                    <input type="password" class="form-control" id="password">
                    <div id="password-msg" class="form-text text-danger"></div>
                </div>
                <div class="col-md-3 mb-3">
                    <label for="repassword" class="form-label">Reingreso de clave</label>
                    <input type="password" class="form-control" id="repassword">
                    <div id="repassword-msg" class="form-text text-danger"></div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="direccion" class="form-label">Direccion </label>
                    <input type="text" class="form-control" id="direccion">
                    <div id="direccion-msg" class="form-text text-danger"></div>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="comuna" class="form-label">Comuna</label>
                    <select class="form-select" id="comuna">
                        <option value="">-- Seleccione una comuna --</option>
                        <option value="santiago">Santiago</option>
                        <option value="providencia">Providencia</option>
                        <option value="nunoa">Ñuñoa</option>
                        <option value="lascondes">Las Condes</option>
                        <option value="maipu">Maipú</option>
                        <option value="pudahuel">Pudahuel</option>
                        <option value="quilicura">Quilicura</option>
                        <option value="lamaipu">La Florida</option>
                        <option value="recoleta">Recoleta</option>
                        <option value="estacion">Estación Central</option>
                    </select>
                    <div id="comuna-msg" class="form-text text-danger"></div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-4 mb-3">
                    <label for="telefono" class="form-label">Telefono</label>
                    <input type="text" class="form-control" id="telefono" placeholder="+56912345678">
                    <div id="telefono-msg" class="form-text text-danger"></div>
                </div>
                <div class="col-md-8 mb-3">
                    <label for="url" class="form-label">Pagina web personal</label>
                    <input type="text" class="form-control" id="url" placeholder="https://mipagina.cl">
                    <div id="url-msg" class="form-text text-danger"></div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="hobby" class="form-label">Aficiones, minimo 2</label>
                    <div class="input-group">
                        <input type="text" class="form-control" id="hobby">
                        <button onclick="agregar()" class="btn btn-secondary" type="button">Agregar</button>
                    </div>
                    <div id="hobby-msg" class="form-text text-danger"></div>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="hobby-list" class="form-label">Aficiones agregadas</label>
                    <ul id="hobby-list" class="list-group"></ul>
                </div>
            </div>

            <button type="submit" class="btn btn-primary my-3">Enviar</button>
            <button type="reset" class="btn btn-secondary my-3" onclick="limpiarForm()">Limpiar</button>
        </form>
    </main>
    <script src="js/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
